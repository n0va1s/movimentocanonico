services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    env_file: .env
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 7001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    environment:
      PROXY_CODEGEN_BACKEND: http://backend:7001
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend
